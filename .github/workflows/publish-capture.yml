name: Publish existing CallBlock capture
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-capture.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CallBlockPro-real-AppStore-screenshots
          path: capture
          github-token: ${{ github.token }}
          run-id: 42535689129
      - name: Publish original screenshot for App Store upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          raw=Path('capture/CallBlockPro-iPhone.png').read_bytes()
          url='https://api.github.com/repos/valentinnedelcu1974-arch/CallBlock-Pro-iOS/contents/docs/screenshots/CallBlockPro-iPhone.png'
          payload={'message':'Publish original simulator screenshot for CallBlock Pro 1.1 (2)','content':base64.b64encode(raw).decode(),'branch':'main'}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as response:
              result=json.load(response)
          print('Published unchanged screenshot: '+result['content']['path'])
          PY
