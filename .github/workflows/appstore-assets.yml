name: CallBlock real App Store screenshots
on:
  push:
    branches: [main]
    paths: [.github/workflows/appstore-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project and select simulator
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          brew install xcodegen
          xcodegen generate
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); all=[x for a in d["devices"].values() for x in a]; names=["iPhone 16 Pro Max","iPhone 17 Pro Max","iPhone 16 Plus","iPhone 15 Plus"]; print(next(x["udid"] for n in names for x in all if x["name"]==n))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Capture actual running application
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcodebuild -project CallBlockPro.xcodeproj -scheme CallBlockPro -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath "$RUNNER_TEMP/Capture.xcresult" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:CallBlockProUITests/StoreCaptureTests/testCaptureHelp test > capture.log 2>&1 || { tail -100 capture.log; exit 1; }
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Capture.xcresult" --output-path appstore-screenshots
          find appstore-screenshots -type f
      - name: Publish unchanged screenshot attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          for i,p in enumerate(sorted(Path('appstore-screenshots').rglob('*.png'))):
              url='https://api.github.com/repos/valentinnedelcu1974-arch/CallBlock-Pro-iOS/contents/docs/screenshots/CallBlock-Help-'+str(i)+'.png'
              payload={'message':'Publish actual CallBlock help-screen capture','content':base64.b64encode(p.read_bytes()).decode(),'branch':'main'}
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req) as response: result=json.load(response)
              print(result['content']['path'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CallBlockPro-real-AppStore-screenshots
          path: appstore-screenshots
          if-no-files-found: error
          retention-days: 7
