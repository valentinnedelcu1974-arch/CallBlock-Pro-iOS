name: CallBlock real review screenshots
on:
  push:
    branches: [main]
    paths: [.github/workflows/appstore-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project and select iPhone simulator
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for v in d["devices"].values() for x in v if x.get("isAvailable") and x["name"].startswith("iPhone")]; preferred=[x for n in ["iPhone 17 Pro","iPhone 16 Pro","iPhone 16"] for x in a if x["name"]==n]; print((preferred or a)[0]["udid"])')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$SIMULATOR_ID" appearance light
      - name: Capture native subscription screen using StoreKit Test
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcodebuild -project CallBlockPro.xcodeproj -scheme CallBlockPro -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/Capture.xcresult" \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 90 \
            -only-testing:CallBlockProUITests/StoreCaptureTests/testCaptureHelp test
      - name: Export actual screenshot attachments
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Capture.xcresult" --output-path appstore-screenshots
          find appstore-screenshots -type f
      - name: Preserve real review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallBlockPro-native-review-screenshots
          path: appstore-screenshots
          if-no-files-found: error
          retention-days: 7
