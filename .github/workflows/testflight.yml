name: TestFlight Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: callblock-testflight
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_API_KEY_ID: ${{ secrets.CALLBLOCK_ASC_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.CALLBLOCK_ASC_ISSUER_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.CALLBLOCK_ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare App Store Connect authentication
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_API_KEY_ID:?Missing CALLBLOCK_ASC_KEY_ID}"
          : "${ASC_API_ISSUER_ID:?Missing CALLBLOCK_ASC_ISSUER_ID}"
          : "${ASC_API_PRIVATE_KEY:?Missing CALLBLOCK_ASC_PRIVATE_KEY}"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/CallBlockAuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/CallBlockAuthKey.p8" -noout
          security create-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/callblock.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/callblock.keychain-db"
          security unlock-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/callblock.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/callblock.keychain-db" login.keychain-db
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive Build 3 with automatic signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CallBlockPro.xcodeproj -scheme CallBlockPro \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CallBlockPro.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/CallBlockAuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM=F3639777XM \
            CURRENT_PROJECT_VERSION=3 archive
          INFO="$RUNNER_TEMP/CallBlockPro.xcarchive/Products/Applications/CallBlockPro.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.callblockpro.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "3"
          EXT_INFO="$RUNNER_TEMP/CallBlockPro.xcarchive/Products/Applications/CallBlockPro.app/PlugIns/CallDirectory.appex/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_INFO")" = "com.callblockpro.app.directory"
      - name: Cloud sign and upload to TestFlight only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/CallBlockExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>F3639777XM</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CallBlockPro.xcarchive" \
            -exportPath "$RUNNER_TEMP/callblock-export" \
            -exportOptionsPlist "$RUNNER_TEMP/CallBlockExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/CallBlockAuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          echo "Build 3 uploaded. App Review submission is intentionally not automated." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up signing credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/CallBlockAuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/callblock.keychain-db" || true
