workflows:
  xnocall-verify:
    name: XNoCall - simulator tests and review captures
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate project
        script: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Run unit and interface tests
        script: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcodebuild test -project CallBlockPro.xcodeproj -scheme CallBlockPro -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/XNoCall.xcresult CODE_SIGNING_ALLOWED=NO
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/XNoCall.xcresult --output-path build/screenshots
    artifacts:
      - build/screenshots/**
      - build/XNoCall.xcresult/**
  xnocall-testflight:
    name: XNoCall - signed TestFlight release
    max_build_duration: 25
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: XStarCadAppStore
    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - xnocall_appstore
          - xnocall_directory_appstore
        certificates:
          - xstarcad_existing_distribution
    scripts:
      - name: Generate XNoCall project
        script: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Verify interface and capture current screens
        script: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcodebuild test -project CallBlockPro.xcodeproj -scheme CallBlockPro -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/XNoCall.xcresult CODE_SIGNING_ALLOWED=NO
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/XNoCall.xcresult --output-path build/screenshots
      - name: Apply dedicated profiles
        script: xcode-project use-profiles
      - name: Archive and export XNoCall 1.1 build 5
        script: |
          set -euo pipefail
          xcode-project build-ipa --project CallBlockPro.xcodeproj --scheme CallBlockPro --archive-flags='CURRENT_PROJECT_VERSION=5'
    artifacts:
      - build/ios/ipa/*.ipa
      - build/screenshots/**
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
